name: central-deploy

on:
  repository_dispatch:
    types: [ deploy-service ]

permissions:
  contents: read

concurrency:
  group: production-${{ github.event.client_payload.service.name || 'unknown' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      manifest_dir: ${{ steps.validate.outputs.manifest_dir }}
      deployment: ${{ steps.validate.outputs.deployment }}
      container: ${{ steps.validate.outputs.container }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment request
        id: validate
        env:
          SERVICE: ${{ github.event.client_payload.service.name }}
          REPOSITORY: ${{ github.event.client_payload.service.repository }}
          BRANCH: ${{ github.event.client_payload.service.branch }}
          SHA: ${{ github.event.client_payload.commit.sha }}
          IMAGE: ${{ github.event.client_payload.build.image_name }}
          QUALITY: ${{ github.event.client_payload.quality.result }}
          COVERAGE: ${{ github.event.client_payload.quality.coverage_result }}
          BUILD: ${{ github.event.client_payload.build.result }}
        run: bash .github/scripts/validate-service.sh

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Copy k8s manifests to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ needs.validate.outputs.manifest_dir }}/*"
          target: "/tmp/central-deploy-${{ github.run_id }}"

      - name: Apply manifests and roll out new image
        uses: appleboy/ssh-action@v1
        env:
          RUN_ID: ${{ github.run_id }}
          MANIFEST_DIR: ${{ needs.validate.outputs.manifest_dir }}
          DEPLOYMENT: ${{ needs.validate.outputs.deployment }}
          CONTAINER: ${{ needs.validate.outputs.container }}
          IMAGE: ${{ github.event.client_payload.build.image_name }}
          TARGET_TAG: ${{ github.event.client_payload.commit.sha }}
          SIMULATE: ${{ github.event.client_payload.options.simulate_deploy_failure }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: RUN_ID,MANIFEST_DIR,DEPLOYMENT,CONTAINER,IMAGE,TARGET_TAG,SIMULATE
          script_file: .github/scripts/deploy-rollout.sh

  notify:
    needs: [validate, deploy]
    if: always()
    uses: nhnacademy-aiot3-yes-ai-do/Webhook/.github/workflows/discord-notify.yml@main

    with:
      service_name: ${{ github.event.client_payload.service.name }}
      build_result: ${{ github.event.client_payload.build.result }}
      deploy_result: ${{ needs.deploy.result }}
      repository: ${{ github.event.client_payload.service.repository }}
      branch: ${{ github.event.client_payload.service.branch }}
      commit_sha: ${{ github.event.client_payload.commit.sha }}
      commit_message: ${{ github.event.client_payload.commit.message }}
      actor: ${{ github.event.client_payload.commit.actor }}
      workflow_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      quality_result: ${{ github.event.client_payload.quality.result }}
      coverage_result: ${{ github.event.client_payload.quality.coverage_result }}
      coverage_percentage: ${{ github.event.client_payload.quality.coverage_percentage }}
      coverage_threshold: ${{ github.event.client_payload.quality.coverage_threshold || 'not_available' }}
      sonar_url: ${{ github.event.client_payload.quality.sonar_url }}

    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
