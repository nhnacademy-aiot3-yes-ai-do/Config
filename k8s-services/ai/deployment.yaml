apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: ai-server
          image: ghcr.io/nhnacademy-aiot3-yes-ai-do/ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ai-config
            - secretRef:
                name: backend-domain-secret
            - secretRef:
                name: ai-secret
            - secretRef:
                name: log-secret
            - secretRef:
                name: postgresdb-secret
            - secretRef:
                name: redis-secret
            - secretRef:
                name: rabbitmq-secret
