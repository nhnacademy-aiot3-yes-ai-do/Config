apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front-server
  template:
    metadata:
      labels:
        app: front-server
    spec:
      containers:
        - name: front-server
          image: ghcr.io/nhnacademy-aiot3-yes-ai-do/front_server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: front-config
            - secretRef:
                name: front-secret
